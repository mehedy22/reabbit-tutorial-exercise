plugins {
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.example'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Security overrides, ahead of what Spring Boot 4.1.1 picks:
// Jackson slow-parsing fix, and amqp-client message-size/recursion fix.
ext['jackson-bom.version'] = '3.1.8'
ext['jackson-2-bom.version'] = '2.21.8'
ext['rabbit-amqp-client.version'] = '5.37.0'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

// Forward keyboard input to the app, so the producer profile can read typed messages.
bootRun {
	standardInput = System.in
}

test {
	useJUnitPlatform()
}
